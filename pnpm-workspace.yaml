# Next.js 16.3.3 is the official August 2026 critical security release.
# Keep the minimum-release-age policy enabled for every other dependency while
# allowing this exact, intentionally selected patch and its platform binaries.
packages:
  - '.'

minimumReleaseAgeExclude:
  - '@next/env@16.3.3'
  - '@next/mdx@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - next@16.3.3
