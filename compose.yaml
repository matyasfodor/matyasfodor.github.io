services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 20
    volumes:
      - qr-redis-data:/data
    ports:
      - "6379:6379"

volumes:
  qr-redis-data:
